# ============================================================
# 360° 监控守护进程 - 测试配置
# 用于在 test 目录验证告警触发
# ============================================================

[General]
# 采样周期（秒）— 调低便于快速测试
sample_interval_sec = 1
# 趋势检测窗口（采样点）
trend_window_size = 15
# 内存泄漏趋势阈值（MB/采样点）— 调低，快速触发泄漏告警
mem_trend_threshold_mb = 1.5
# 日志文件
log_file = test_monitor.log

[System]
# 系统CPU阈值（%）— 调低，方便触发系统级告警
cpu_threshold = 60.0
# 系统内存阈值（%）
mem_threshold = 90.0

[LLM]
# 是否启用 LLM 诊断（异常时自动调用大模型生成诊断报告）
enabled = true
# 兼容 OpenAI 格式的 API 地址
api_url = https://llm.xinlicloud.top/v1/chat/completions
# API Key
api_key = sk-37U0drw7v3R4ltt1Czhf9bSICOBE2WwSpFw0QHsGbVNAK7P7
# 模型名称
model = glm-5.2

[Targets]
# 监控目标进程：name,cpu阈值(%),内存阈值(MB),句柄阈值(个)
# 监控 360 服务端进程（故障注入程序进程名也叫 server，用于验证监控能识别故障）
target_server = server,30.0,200.0,100
# cpu_stress 压力测试程序，CPU 阈值设为 30%，方便快速触发
target_cpu_stress = cpu_stress,30.0,200.0,200