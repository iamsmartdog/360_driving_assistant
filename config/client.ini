# ============================================================================
# 360度智能行车辅助系统 - 客户端配置
# ============================================================================
# 部署时将此文件放到 client 可执行文件同目录下，文件名必须为 config.ini
# 文件不存在时，客户端使用内置默认值启动。
# ============================================================================

[FDBus]
# FDBus 服务名（需与服务端 server.ini 中一致）
ServerName=driving_assistant

[Models]
# 模型目录（绝对路径）。留空则自动按 appDir/../resources/models 查找
Dir=
# 车辆检测模型文件名
VehicleModel=yolov8n.onnx
# 红绿灯检测模型文件名
TrafficLightModel=trafficrules-yolo11n.onnx

[Storage]
# 视频保存子目录（相对于用户 home 目录）
VideoDir=Videos/360DrivingAssistant
# 存储上限（GB），超过后自动清理旧录像
StorageSize=10
# 达到上限后是否自动删除最旧录像
AutoDelete=false
