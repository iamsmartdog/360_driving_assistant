# ============================================================
# 360° 智能行车辅助系统 - 监控守护进程配置
# ============================================================

[General]
# 采样周期（秒）
sample_interval_sec = 2
# 趋势检测窗口（保留多少采样点用于线性回归）
trend_window_size = 30
# 内存泄漏趋势阈值（MB/采样点，超过则告警）
mem_trend_threshold_mb = 5.0
# 日志文件路径（空则不写文件）
log_file = monitor.log

[System]
# 系统CPU使用率阈值（%）
cpu_threshold = 90.0
# 系统内存使用率阈值（%）
mem_threshold = 90.0

[LLM]
# 是否启用 LLM 诊断（异常时自动调用大模型生成诊断报告）
# 需要先安装 libcurl4-openssl-dev 并重新编译
enabled = false
# 兼容 OpenAI 格式的 API 地址
api_url = https://llm.xinlicloud.top/v1/chat/completions
# API Key
api_key = sk-37U0drw7v3R4ltt1Czhf9bSICOBE2WwSpFw0QHsGbVNAK7P7
# 模型名称（可选模型：glm-5.2, deepseek-v4-flash, qwen3.7-plus, kimi-k2.6）
model = glm-5.2

[Targets]
# 监控目标进程：name,cpu阈值(%),内存阈值(MB),句柄阈值(个)
# 360 服务端进程
target_server = server,80.0,512.0,500
# 360 客户端进程
target_client = client,80.0,512.0,500